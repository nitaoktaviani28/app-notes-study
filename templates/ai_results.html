<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Result - complite study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Ganti tema">Dark</button>
  <main class="result-page">
    <a href="/" class="back-link">Kembali</a>
    <h1>Hasil AI - {{ material.title }}</h1>
    {% for r in results %}
      <section class="result-card">
        <h2>{{ r.result_type|upper }} - {{ r.created_at.strftime('%Y-%m-%d %H:%M') }}</h2>
        <pre>{{ r.content }}</pre>
      </section>
    {% endfor %}
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
