name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: haechanlovelove/complite-study

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    env:
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: APP_ENV_FILE
          script: |
            set -e
            mkdir -p /home/ubuntu/complite-study
            if [ -z "$APP_ENV_FILE" ]; then
              echo "APP_ENV_FILE secret kosong"
              exit 1
            fi
            printf "%s" "$APP_ENV_FILE" > /home/ubuntu/complite-study/.env
            docker pull haechanlovelove/complite-study:latest
            docker rm -f complite-study || true
            docker run -d --name complite-study \
              --restart unless-stopped \
              --env-file /home/ubuntu/complite-study/.env \
              -p 8000:8000 \
              haechanlovelove/complite-study:latest
            docker image prune -f
